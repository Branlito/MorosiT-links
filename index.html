<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Links</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d0d0d;
      --surface: #161616;
      --surface-hover: #1e1e1e;
      --border: rgba(255,255,255,0.07);
      --border-hover: rgba(255,255,255,0.16);
      --text-primary: #f0ede8;
      --text-secondary: #888880;
      --accent: #c8c0b0;
      --spotify: #1DB954;
      --soundcloud: #FF5500;
      --instagram: #E1306C;
    }

    html, body {
      min-height: 100%;
      background: var(--bg);
      color: var(--text-primary);
      font-family: 'DM Sans', sans-serif;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 60px 20px 80px;
    }

    /* Subtle noise texture */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
    }

    /* ── Photo ── */
    .photo-wrapper {
      width: 60%;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid var(--border-hover);
      background: var(--surface);
      margin-bottom: 24px;
      flex-shrink: 0;
    }

    .photo-wrapper img {
      width: 100%;
      height: auto;
      display: block;
    }

    .photo-placeholder {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 10px;
      color: var(--text-secondary);
      font-size: 13px;
      font-family: 'DM Sans', sans-serif;
      letter-spacing: 0.06em;
      text-align: center;
      text-transform: uppercase;
    }

    .photo-placeholder svg {
      opacity: 0.4;
    }

    /* ── Identity ── */
    .name {
      font-family: 'Syne', sans-serif;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.01em;
      color: var(--text-primary);
      margin-bottom: 6px;
      text-align: center;
    }

    .bio {
      font-size: 13.5px;
      color: var(--text-secondary);
      text-align: center;
      letter-spacing: 0.02em;
      margin-bottom: 40px;
      line-height: 1.6;
      max-width: 300px;
    }

    /* ── Links card ── */
    .links-card {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .link-item {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 16px 18px;
      border-radius: 13px;
      text-decoration: none;
      color: var(--text-primary);
      background: transparent;
      transition: background 0.18s ease, border-color 0.18s ease;
      border: 1px solid transparent;
      position: relative;
      overflow: hidden;
    }

    .link-item:hover {
      background: var(--surface-hover);
      border-color: var(--border);
    }

    .link-item:active {
      transform: scale(0.99);
    }

    /* color accent bar on left */
    .link-item::before {
      content: '';
      position: absolute;
      left: 0;
      top: 20%;
      height: 60%;
      width: 2px;
      border-radius: 2px;
      opacity: 0;
      transition: opacity 0.18s ease;
    }

    .link-item:hover::before { opacity: 1; }

    .link-item.spotify::before  { background: var(--spotify); }
    .link-item.soundcloud::before { background: var(--soundcloud); }
    .link-item.instagram::before { background: var(--instagram); }

    .link-icon {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .link-item.spotify  .link-icon { background: rgba(29,185,84,0.1); }
    .link-item.soundcloud .link-icon { background: rgba(255,85,0,0.1); }
    .link-item.instagram .link-icon { background: rgba(225,48,108,0.1); }

    .link-info {
      flex: 1;
    }

    .link-platform {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-secondary);
      margin-bottom: 2px;
    }

    .link-label {
      font-family: 'Syne', sans-serif;
      font-size: 15px;
      font-weight: 600;
      color: var(--text-primary);
    }

    .link-arrow {
      color: var(--text-secondary);
      opacity: 0.5;
      transition: opacity 0.18s, transform 0.18s;
    }

    .link-item:hover .link-arrow {
      opacity: 1;
      transform: translate(2px, -2px);
    }

    .divider {
      height: 1px;
      background: var(--border);
      margin: 2px 8px;
    }

    /* ── Footer ── */
    .footer {
      margin-top: 32px;
      font-size: 11px;
      color: var(--text-secondary);
      opacity: 0.4;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    /* ── Play button ── */
    .play-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 18px;
      margin-bottom: 8px;
      padding: 10px 20px;
      background: var(--surface);
      border: 1px solid var(--border-hover);
      border-radius: 50px;
      color: var(--text-secondary);
      font-family: 'DM Sans', sans-serif;
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.18s, color 0.18s, border-color 0.18s;
    }

    .play-btn:hover {
      background: var(--surface-hover);
      border-color: rgba(255,255,255,0.25);
      color: var(--text-primary);
    }

    .play-btn.playing {
      color: #1DB954;
      border-color: rgba(29,185,84,0.4);
    }

    .play-btn svg {
      flex-shrink: 0;
      transition: transform 0.18s;
    }
  </style>
</head>
<body>
  <div class="container">

    <!-- Photo -->
    <div class="photo-wrapper">
      <img src="ACAB.jpg" alt="MorosiT" />
    </div>

    <!-- Identity -->
    <h1 class="name">MorosiT</h1>
    <p class="bio">La suite arrive .... <strong style="color:#E63946;font-weight:700;">ACAB</strong></p>

    <!-- Play button -->
    <button class="play-btn" id="playBtn" onclick="togglePlay()">
      <svg id="playIcon" width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
        <polygon points="5,3 19,12 5,21"/>
      </svg>
      <span id="playLabel">Écouter</span>
    </button>

    <!-- Links -->
    <div class="links-card">

      <a href="https://open.spotify.com/intl-fr/artist/0AIBAQGyTMDwqUKrR67oiA?si=bkneyYpORWmZ4WrBAnmjZA" target="_blank" rel="noopener" class="link-item spotify">
        <div class="link-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
            <circle cx="12" cy="12" r="10" fill="#1DB954"/>
            <path d="M7.5 15.5c2.8-1.7 6.3-1.9 9.1-.5" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
            <path d="M6.5 12.5c3.5-2 7.8-2.3 11.2-.6" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
            <path d="M5.5 9.5c4.2-2.4 9.3-2.7 13.5-.7" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="link-info">
          <div class="link-platform">Music</div>
          <div class="link-label">Spotify</div>
        </div>
        <svg class="link-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M7 17L17 7M17 7H7M17 7v10"/>
        </svg>
      </a>

      <div class="divider"></div>

      <a href="https://on.soundcloud.com/S1uKDriAJpCHmWDQb0" target="_blank" rel="noopener" class="link-item soundcloud">
        <div class="link-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="#FF5500">
            <path d="M2 13.8c0 1.8 1.4 3.2 3.1 3.2h12.6c1.8 0 3.3-1.5 3.3-3.3 0-1.6-1.1-2.9-2.6-3.2-.1-3.1-2.5-5.5-5.6-5.5-2.3 0-4.3 1.4-5.2 3.4-.3-.1-.6-.2-.9-.2C4.3 8.2 2 11 2 13.8z"/>
          </svg>
        </div>
        <div class="link-info">
          <div class="link-platform">Music</div>
          <div class="link-label">SoundCloud</div>
        </div>
        <svg class="link-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M7 17L17 7M17 7H7M17 7v10"/>
        </svg>
      </a>

      <div class="divider"></div>

      <a href="https://www.instagram.com/malauryboisrond/" target="_blank" rel="noopener" class="link-item instagram">
        <div class="link-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
            <defs>
              <linearGradient id="ig" x1="0%" y1="100%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#FFDC80"/>
                <stop offset="25%" stop-color="#FCAF45"/>
                <stop offset="50%" stop-color="#F77737"/>
                <stop offset="75%" stop-color="#E1306C"/>
                <stop offset="100%" stop-color="#833AB4"/>
              </linearGradient>
            </defs>
            <rect x="2" y="2" width="20" height="20" rx="6" fill="url(#ig)"/>
            <circle cx="12" cy="12" r="4" stroke="white" stroke-width="1.6" fill="none"/>
            <circle cx="17.5" cy="6.5" r="1.2" fill="white"/>
          </svg>
        </div>
        <div class="link-info">
          <div class="link-platform">Social</div>
          <div class="link-label">Instagram</div>
        </div>
        <svg class="link-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M7 17L17 7M17 7H7M17 7v10"/>
        </svg>
      </a>

    </div>

    <p class="footer">© 2026</p>
  </div>

  <!-- Autoplay SoundCloud -->
  <iframe
    id="sc-player"
    width="0" height="0"
    style="position:absolute;opacity:0;pointer-events:none;"
    scrolling="no" frameborder="no" allow="autoplay"
    src="https://w.soundcloud.com/player/?url=https://on.soundcloud.com/S1uKDriAJpCHmWDQb0&auto_play=false&hide_related=true&show_comments=false&show_user=false&show_reposts=false&visual=false">
  </iframe>

  <script>
    var playing = false;
    var widget = null;

    window.addEventListener('load', function() {
      widget = SC.Widget(document.getElementById('sc-player'));
    });

    function togglePlay() {
      if (!widget) return;
      var btn = document.getElementById('playBtn');
      var icon = document.getElementById('playIcon');
      var label = document.getElementById('playLabel');

      if (!playing) {
        widget.play();
        playing = true;
        btn.classList.add('playing');
        icon.innerHTML = '<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>';
        label.textContent = 'En cours...';
      } else {
        widget.pause();
        playing = false;
        btn.classList.remove('playing');
        icon.innerHTML = '<polygon points="5,3 19,12 5,21"/>';
        label.textContent = 'Écouter';
      }
    }
  </script>
  <script src="https://w.soundcloud.com/player/api.js"></script>
</body>
</html>
