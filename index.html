<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MorosiT</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #080808;
      --surface: #111111;
      --surface-2: #181818;
      --border: rgba(255,255,255,0.06);
      --border-h: rgba(255,255,255,0.14);
      --text: #ede9e3;
      --muted: #5a5750;
      --dim: #2a2825;
      --spotify: #1DB954;
      --soundcloud: #FF5500;
      --instagram: #E1306C;
      --youtube: #FF0000;
      --red: #E63946;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(22px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes scaleIn {
      from { opacity: 0; transform: scale(0.94); }
      to   { opacity: 1; transform: scale(1); }
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%       { opacity: 0.3; transform: scale(0.65); }
    }

    @keyframes scanline {
      0%   { transform: translateY(-100%); }
      100% { transform: translateY(100vh); }
    }

    @keyframes waveform {
      0%,100% { transform: scaleY(0.3); }
      50%      { transform: scaleY(1); }
    }

    @keyframes glitch {
      0%   { clip-path: inset(0 0 98% 0); transform: translate(-2px, 0); }
      10%  { clip-path: inset(30% 0 60% 0); transform: translate(2px, 0); }
      20%  { clip-path: inset(60% 0 20% 0); transform: translate(-1px, 0); }
      30%  { clip-path: inset(20% 0 70% 0); transform: translate(3px, 0); }
      40%  { clip-path: inset(80% 0 5% 0);  transform: translate(-2px, 0); }
      50%  { clip-path: inset(0 0 98% 0);   transform: translate(0, 0); }
      100% { clip-path: inset(0 0 98% 0);   transform: translate(0, 0); }
    }

    html, body {
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Space Grotesk', sans-serif;
    }

    /* Grain overlay */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.055'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 100;
      mix-blend-mode: overlay;
    }

    /* Ambient glow top */
    body::before {
      content: '';
      position: fixed;
      top: -200px;
      left: 50%;
      transform: translateX(-50%);
      width: 600px;
      height: 500px;
      background: radial-gradient(ellipse, rgba(200,150,80,0.07) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    /* Scanline sweep */
    .scanline {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.03), transparent);
      animation: scanline 8s linear infinite;
      pointer-events: none;
      z-index: 99;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 48px 20px 80px;
    }

    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ── Lang ── */
    .lang-switcher {
      display: flex;
      gap: 4px;
      align-self: flex-end;
      margin-bottom: 36px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 3px;
      animation: fadeUp 0.5s ease both;
    }

    .lang-btn {
      background: transparent;
      border: none;
      border-radius: 7px;
      font-size: 11px;
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 600;
      letter-spacing: 0.12em;
      color: var(--muted);
      cursor: pointer;
      padding: 5px 12px;
      transition: background 0.2s, color 0.2s;
    }

    .lang-btn.active {
      background: var(--surface-2);
      color: var(--text);
    }

    /* ── Photo ── */
    .photo-wrapper {
      width: 58%;
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid var(--border-h);
      margin-bottom: 28px;
      position: relative;
      animation: scaleIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.1s both;
    }

    .photo-wrapper::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(to bottom, transparent 50%, rgba(8,8,8,0.6) 100%);
    }

    .photo-wrapper img {
      width: 100%;
      height: auto;
      display: block;
      filter: contrast(1.05) saturate(0.9);
    }

    /* ── Name ── */
    .name-block {
      text-align: center;
      margin-bottom: 12px;
      animation: fadeUp 0.6s ease 0.2s both;
      position: relative;
    }

    .name {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 52px;
      letter-spacing: 0.08em;
      color: var(--text);
      line-height: 1;
      position: relative;
      display: inline-block;
    }

    /* Glitch effect on name */
    .name::before,
    .name::after {
      content: attr(data-text);
      position: absolute;
      inset: 0;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 52px;
      letter-spacing: 0.08em;
    }

    .name::before {
      color: var(--red);
      animation: glitch 6s infinite;
      animation-delay: 1s;
    }

    .name::after {
      color: #3af;
      animation: glitch 6s infinite;
      animation-delay: 1.15s;
      transform: translate(1px, 0);
    }

    .name:hover::before {
      animation-duration: 0.3s;
    }

    /* ── Bio ── */
    .bio {
      font-size: 13px;
      font-weight: 400;
      color: var(--muted);
      text-align: center;
      letter-spacing: 0.03em;
      margin-bottom: 28px;
      line-height: 1.7;
      max-width: 280px;
      animation: fadeUp 0.6s ease 0.3s both;
    }

    /* ── Play ── */
    .player-zone {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      margin-bottom: 28px;
      animation: fadeUp 0.6s ease 0.4s both;
    }

    .play-btn {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 24px;
      background: var(--surface);
      border: 1px solid var(--border-h);
      border-radius: 50px;
      color: var(--muted);
      font-family: 'Space Grotesk', sans-serif;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.2s ease;
      position: relative;
      overflow: hidden;
    }

    .play-btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, rgba(29,185,84,0.08) 0%, transparent 70%);
      opacity: 0;
      transition: opacity 0.3s;
    }

    .play-btn:hover {
      border-color: rgba(255,255,255,0.22);
      color: var(--text);
    }

    .play-btn:hover::before { opacity: 1; }

    .play-btn.playing {
      color: var(--spotify);
      border-color: rgba(29,185,84,0.35);
    }

    .play-btn.playing::before { opacity: 1; }

    /* Waveform bars */
    .waveform {
      display: flex;
      align-items: center;
      gap: 2px;
      height: 14px;
      opacity: 0;
      transition: opacity 0.3s;
    }

    .waveform.active { opacity: 1; }

    .wave-bar {
      width: 2px;
      background: var(--spotify);
      border-radius: 1px;
      transform-origin: center;
    }

    .wave-bar:nth-child(1) { height: 6px;  animation: waveform 0.8s ease-in-out infinite 0s; }
    .wave-bar:nth-child(2) { height: 12px; animation: waveform 0.8s ease-in-out infinite 0.1s; }
    .wave-bar:nth-child(3) { height: 8px;  animation: waveform 0.8s ease-in-out infinite 0.2s; }
    .wave-bar:nth-child(4) { height: 14px; animation: waveform 0.8s ease-in-out infinite 0.15s; }
    .wave-bar:nth-child(5) { height: 6px;  animation: waveform 0.8s ease-in-out infinite 0.05s; }

    .wave-bar:not(.active *) {
      animation-play-state: paused;
    }

    .now-playing {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      font-weight: 500;
      color: var(--spotify);
      letter-spacing: 0.06em;
      opacity: 0;
      transform: translateY(-4px);
      transition: opacity 0.3s ease, transform 0.3s ease;
    }

    .now-playing.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .now-playing .dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--spotify);
      animation: pulse 1.4s ease-in-out infinite;
    }

    /* ── Links ── */
    .links-wrap {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 8px;
      animation: fadeUp 0.6s ease 0.5s both;
    }

    .link-item {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 16px 20px;
      border-radius: 14px;
      text-decoration: none;
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--border);
      position: relative;
      overflow: hidden;
      transition: border-color 0.2s, transform 0.15s;
    }

    /* Shimmer on hover */
    .link-item::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(105deg, transparent 40%, rgba(255,255,255,0.03) 50%, transparent 60%);
      transform: translateX(-100%);
      transition: transform 0.5s ease;
    }

    .link-item:hover::after {
      transform: translateX(100%);
    }

    .link-item:hover {
      border-color: var(--border-h);
      transform: translateY(-1px);
    }

    .link-item:active {
      transform: scale(0.99) translateY(0);
    }

    /* Left accent */
    .link-item::before {
      content: '';
      position: absolute;
      left: 0;
      top: 16%;
      height: 68%;
      width: 2px;
      border-radius: 0 2px 2px 0;
      opacity: 0;
      transition: opacity 0.2s;
    }

    .link-item:hover::before { opacity: 1; }

    .link-item.spotify::before    { background: var(--spotify); }
    .link-item.soundcloud::before { background: var(--soundcloud); }
    .link-item.instagram::before  { background: var(--instagram); }

    .link-icon {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      border: 1px solid transparent;
      transition: border-color 0.2s;
    }

    .link-item.spotify .link-icon {
      background: rgba(29,185,84,0.08);
    }
    .link-item.spotify:hover .link-icon {
      border-color: rgba(29,185,84,0.2);
    }

    .link-item.soundcloud .link-icon {
      background: rgba(255,85,0,0.08);
    }
    .link-item.soundcloud:hover .link-icon {
      border-color: rgba(255,85,0,0.2);
    }

    .link-item.youtube .link-icon {
      background: rgba(255,0,0,0.08);
    }
    .link-item.youtube:hover .link-icon {
      border-color: rgba(255,0,0,0.2);
    }
    .link-item.youtube::before { background: var(--youtube); }

    .link-item.instagram .link-icon {
      background: rgba(225,48,108,0.08);
    }
    .link-item.instagram:hover .link-icon {
      border-color: rgba(225,48,108,0.2);
    }

    .link-info { flex: 1; }

    .link-platform {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 3px;
    }

    .link-label {
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
      letter-spacing: -0.01em;
    }

    .link-arrow {
      color: var(--muted);
      opacity: 0.4;
      transition: opacity 0.2s, transform 0.2s;
      flex-shrink: 0;
    }

    .link-item:hover .link-arrow {
      opacity: 0.9;
      transform: translate(3px, -3px);
    }

    /* ── Footer ── */
    .footer {
      margin-top: 40px;
      font-size: 10px;
      font-weight: 500;
      color: var(--muted);
      opacity: 0.3;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      animation: fadeUp 0.6s ease 0.7s both;
    }

    /* ── Cursor glow follow ── */
    .cursor-glow {
      position: fixed;
      width: 300px;
      height: 300px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(200,160,90,0.04) 0%, transparent 70%);
      pointer-events: none;
      transform: translate(-50%, -50%);
      transition: left 0.12s ease, top 0.12s ease;
      z-index: 0;
    }
  </style>
</head>
<body>
  <div class="scanline"></div>
  <div class="cursor-glow" id="cursorGlow"></div>

  <div class="container">

    <!-- Lang -->
    <div class="lang-switcher">
      <button class="lang-btn active" onclick="setLang('fr')" id="btn-fr">FR</button>
      <button class="lang-btn" onclick="setLang('en')" id="btn-en">EN</button>
    </div>

    <!-- Photo -->
    <div class="photo-wrapper">
      <img src="ACAB.jpg" alt="MorosiT" />
    </div>

    <!-- Identity -->
    <div class="name-block">
      <h1 class="name" data-text="MorosiT">MorosiT</h1>
    </div>

    <p class="bio" id="bio"
      data-fr="La suite arrive .... <strong style='color:var(--red);font-weight:700;'>ACAB</strong>"
      data-en="More coming soon .... <strong style='color:var(--red);font-weight:700;'>ACAB</strong>">
      La suite arrive .... <strong style="color:var(--red);font-weight:700;">ACAB</strong>
    </p>

    <!-- Player -->
    <div class="player-zone">
      <button class="play-btn" id="playBtn" onclick="togglePlay()">
        <svg id="playIcon" width="13" height="13" viewBox="0 0 24 24" fill="currentColor">
          <polygon points="5,3 19,12 5,21"/>
        </svg>
        <span id="playLabel" data-fr="Écouter" data-en="Listen">Écouter</span>
        <div class="waveform" id="waveform">
          <div class="wave-bar"></div>
          <div class="wave-bar"></div>
          <div class="wave-bar"></div>
          <div class="wave-bar"></div>
          <div class="wave-bar"></div>
        </div>
      </button>

      <div class="now-playing" id="nowPlaying">
        <span class="dot"></span>
        <span data-fr="♪ Sortie Nocturne" data-en="♪ Sortie Nocturne">♪ Sortie Nocturne</span>
      </div>
    </div>

    <!-- Links -->
    <div class="links-wrap">

      <a href="https://open.spotify.com/intl-fr/artist/0AIBAQGyTMDwqUKrR67oiA?si=bkneyYpORWmZ4WrBAnmjZA" target="_blank" rel="noopener" class="link-item spotify">
        <div class="link-icon">
          <svg width="22" height="22" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="10" fill="#1DB954"/>
            <path d="M7.5 15.5c2.8-1.7 6.3-1.9 9.1-.5" stroke="white" stroke-width="1.6" stroke-linecap="round" fill="none"/>
            <path d="M6.5 12.5c3.5-2 7.8-2.3 11.2-.6" stroke="white" stroke-width="1.6" stroke-linecap="round" fill="none"/>
            <path d="M5.5 9.5c4.2-2.4 9.3-2.7 13.5-.7" stroke="white" stroke-width="1.6" stroke-linecap="round" fill="none"/>
          </svg>
        </div>
        <div class="link-info">
          <div class="link-platform">Music</div>
          <div class="link-label">Spotify</div>
        </div>
        <svg class="link-arrow" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M7 17L17 7M17 7H7M17 7v10"/>
        </svg>
      </a>

      <a href="https://www.youtube.com/@MorosiTonytb" target="_blank" rel="noopener" class="link-item youtube">
        <div class="link-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
            <rect x="2" y="5" width="20" height="14" rx="4" fill="#FF0000"/>
            <polygon points="10,9 16,12 10,15" fill="white"/>
          </svg>
        </div>
        <div class="link-info">
          <div class="link-platform">Video</div>
          <div class="link-label">YouTube</div>
        </div>
        <svg class="link-arrow" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M7 17L17 7M17 7H7M17 7v10"/>
        </svg>
      </a>

      <a href="https://on.soundcloud.com/S1uKDriAJpCHmWDQb0" target="_blank" rel="noopener" class="link-item soundcloud">
        <div class="link-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="#FF5500">
            <path d="M2 13.8c0 1.8 1.4 3.2 3.1 3.2h12.6c1.8 0 3.3-1.5 3.3-3.3 0-1.6-1.1-2.9-2.6-3.2-.1-3.1-2.5-5.5-5.6-5.5-2.3 0-4.3 1.4-5.2 3.4-.3-.1-.6-.2-.9-.2C4.3 8.2 2 11 2 13.8z"/>
          </svg>
        </div>
        <div class="link-info">
          <div class="link-platform">Music</div>
          <div class="link-label">SoundCloud</div>
        </div>
        <svg class="link-arrow" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M7 17L17 7M17 7H7M17 7v10"/>
        </svg>
      </a>

      <a href="https://www.instagram.com/malauryboisrond/" target="_blank" rel="noopener" class="link-item instagram">
        <div class="link-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
            <defs>
              <linearGradient id="ig" x1="0%" y1="100%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#FFDC80"/>
                <stop offset="25%" stop-color="#FCAF45"/>
                <stop offset="50%" stop-color="#F77737"/>
                <stop offset="75%" stop-color="#E1306C"/>
                <stop offset="100%" stop-color="#833AB4"/>
              </linearGradient>
            </defs>
            <rect x="2" y="2" width="20" height="20" rx="6" fill="url(#ig)"/>
            <circle cx="12" cy="12" r="4" stroke="white" stroke-width="1.6" fill="none"/>
            <circle cx="17.5" cy="6.5" r="1.2" fill="white"/>
          </svg>
        </div>
        <div class="link-info">
          <div class="link-platform">Social</div>
          <div class="link-label">Instagram</div>
        </div>
        <svg class="link-arrow" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M7 17L17 7M17 7H7M17 7v10"/>
        </svg>
      </a>

    </div>

    <p class="footer">© 2026 MorosiT</p>
  </div>

  <!-- SoundCloud player hidden -->
  <iframe
    id="sc-player"
    width="0" height="0"
    style="position:absolute;opacity:0;pointer-events:none;"
    scrolling="no" frameborder="no" allow="autoplay"
    src="https://w.soundcloud.com/player/?url=https://soundcloud.com/m0rosit/sortie-nocturne&auto_play=false&hide_related=true&show_comments=false&show_user=false&show_reposts=false&visual=false">
  </iframe>

  <script>
    /* ── Cursor glow ── */
    var glow = document.getElementById('cursorGlow');
    document.addEventListener('mousemove', function(e) {
      glow.style.left = e.clientX + 'px';
      glow.style.top  = e.clientY + 'px';
    });

    /* ── SoundCloud ── */
    var playing = false;
    var widget = null;
    var currentLang = 'fr';

    window.addEventListener('load', function() {
      if (window.SC) widget = SC.Widget(document.getElementById('sc-player'));
    });

    function togglePlay() {
      if (!widget) return;
      var btn       = document.getElementById('playBtn');
      var icon      = document.getElementById('playIcon');
      var label     = document.getElementById('playLabel');
      var nowPlaying = document.getElementById('nowPlaying');
      var wf        = document.getElementById('waveform');

      if (!playing) {
        widget.play();
        playing = true;
        btn.classList.add('playing');
        wf.classList.add('active');
        icon.innerHTML = '<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>';
        label.textContent = currentLang === 'fr' ? 'En cours...' : 'Playing...';
        nowPlaying.classList.add('visible');
      } else {
        widget.pause();
        playing = false;
        btn.classList.remove('playing');
        wf.classList.remove('active');
        icon.innerHTML = '<polygon points="5,3 19,12 5,21"/>';
        label.textContent = currentLang === 'fr' ? 'Écouter' : 'Listen';
        nowPlaying.classList.remove('visible');
      }
    }

    /* ── Lang ── */
    function setLang(lang) {
      currentLang = lang;
      document.getElementById('btn-fr').classList.toggle('active', lang === 'fr');
      document.getElementById('btn-en').classList.toggle('active', lang === 'en');

      var bio = document.getElementById('bio');
      bio.innerHTML = bio.getAttribute('data-' + lang);

      document.querySelectorAll('[data-fr][data-en]').forEach(function(el) {
        if (el.id !== 'bio') el.innerHTML = el.getAttribute('data-' + lang);
      });

      if (!playing) {
        document.getElementById('playLabel').textContent = lang === 'fr' ? 'Écouter' : 'Listen';
      } else {
        document.getElementById('playLabel').textContent = lang === 'fr' ? 'En cours...' : 'Playing...';
      }
    }
  </script>
  <script src="https://w.soundcloud.com/player/api.js"></script>
</body>
</html>
